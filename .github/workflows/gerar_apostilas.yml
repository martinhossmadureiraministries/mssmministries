name: Gerar Apostilas EBE

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Numero de apostilas a gerar'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  gerar-apostilas:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      QUANTIDADE: ${{ github.event.inputs.quantidade || '10' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Garantir pasta _assets
        run: |
          mkdir -p _assets
          for f in logo_ebe.png logo_emblema.png logo_marca_dagua.png logo_pequeno.png; do
            if [ -f "$f" ] && [ ! -f "_assets/$f" ]; then
              cp "$f" "_assets/$f"
            fi
          done

      - name: Gerar lote de apostilas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Gerando ate $QUANTIDADE apostila(s)..."
          python3 gerador_apostila.py --api-key "$GEMINI_API_KEY" --quantidade "$QUANTIDADE"

      - name: Gerar relatorio de progresso
        if: always()
        run: python3 gerar_relatorio.py

      - name: Commit e push
        run: |
          git config user.name "EBE Bot"
          git config user.email "ebe-bot@epignosis.edu"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca para commitar"
          else
            git commit -m "Gerar apostilas: lote automatico [skip ci]"
            git push
          fi

      - name: Resumo
        if: always()
        run: python3 mostrar_resumo.py
